name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create --platforms=android --org com.jesi --project-name jesi_downloader .
      - name: Enable Android core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Could not find android/app/build.gradle(.kts)")

          text = gradle.read_text()
          is_kts = gradle.suffix == ".kts"

          if is_kts:
              enabled = "isCoreLibraryDesugaringEnabled = true"
              dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          else:
              enabled = "coreLibraryDesugaringEnabled true"
              dependency = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"

          if enabled not in text:
              marker = "compileOptions {"
              if marker not in text:
                  raise SystemExit("compileOptions block not found in " + str(gradle))
              text = text.replace(marker, marker + "\n        " + enabled, 1)

          if dependency not in text:
              marker = "dependencies {"
              if marker not in text:
                  text += "\n\ndependencies {\n    " + dependency + "\n}\n"
              else:
                  text = text.replace(marker, marker + "\n    " + dependency, 1)

          gradle.write_text(text)
          print("Enabled core library desugaring in", gradle)
          PY
      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = '''
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
          '''
          if "android.permission.INTERNET" not in s:
              s = s.replace(marker, marker + permissions)
          p.write_text(s)
          PY
      - name: Remove generated placeholder test
        run: rm -rf test
      - name: Get packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jesi-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
